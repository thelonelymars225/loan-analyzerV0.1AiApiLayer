# Lint, typecheck, unit tests (the eval set included) and the web build on pushes to main and
# on pull requests.

name: CI

# Pushes to other branches are left out: a push to a pull request's branch already starts a
# pull_request run, and a second (push) run would only repeat it.
on:
  push:
    branches: [main]
  pull_request:

# One run per pull request (or per push to main): a newer push cancels the older run, except
# on main, where every commit keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rater
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rater"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Tests that need a database create (and drop) their own on this server.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rater

    steps:
      - uses: actions/checkout@v7

      # Real contracts never go in git. .gitignore keeps stray PDFs out, but `git add -f`
      # skips it, so check what is tracked: only the synthetic PDFs may be.
      - name: Check that no other PDF is committed
        run: |
          unexpected=$(git ls-files ':(icase)*.pdf' \
            | grep -vE '^(evals/cases/[^/]+/contract\.pdf|packages/core/test/fixtures/[^/]+\.pdf)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Only the synthetic PDFs may be committed. Remove these:"
            echo "$unexpected"
            exit 1
          fi

      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install PDF and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils tesseract-ocr tesseract-ocr-ara

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tests make their own databases; these two steps check that the scripts work.
      - name: Migrate the database
        run: pnpm db:migrate

      - name: Load the law corpus
        run: pnpm law:ingest

      - name: Check formatting
        run: pnpm format:check

      - name: Lint, typecheck and unit tests
        run: pnpm check

      - name: Build the web app
        run: pnpm --filter @rater/web build
