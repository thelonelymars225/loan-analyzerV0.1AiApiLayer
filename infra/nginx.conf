# Serves the built web app and proxies /api (REST API, Better Auth and server-sent events) to
# the API container. Installed as /etc/nginx/conf.d/default.conf in the web image.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Locations below must not use add_header, or these are no longer sent (nginx rule).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Uploads are at most 10 MB (MAX_UPLOAD_BYTES); leave room for the multipart envelope.
    client_max_body_size 11m;

    # Docker's internal DNS. Resolving at request time (through the variable below) means a
    # restarted API container with a new IP address is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    location /api/ {
        # No URI part after the variable: the request path is passed on unchanged.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, never extend, the client's X-Forwarded-For. The API rate-limits sign-in by
        # client address and reads it from this header. A client can send its own header; an
        # extended list then reaches the API, which cannot trust it and puts every such request
        # in one shared bucket. This assumes nginx faces the clients directly. Behind a load
        # balancer, let nginx learn the real address first (set_real_ip_from <LB CIDR>;
        # real_ip_header X-Forwarded-For; real_ip_recursive on;).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events (GET /api/v1/ratings/{id}/events): pass each event on as soon as
        # the API writes it, and keep the stream open while a rating runs.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        # Uploads go straight to the API, which checks their size and type itself.
        proxy_request_buffering off;
    }

    # Vite puts content-hashed files here, so browsers can keep them for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html and the client router takes over.
    # index.html is revalidated on every load so a new deploy shows up at once.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
