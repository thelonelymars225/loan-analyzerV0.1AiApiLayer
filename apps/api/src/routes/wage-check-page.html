<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wage check (test page)</title>
    <style>
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        max-width: 860px;
        margin: 24px auto;
        padding: 0 16px;
        color: #1b1f24;
      }
      fieldset {
        border: 1px solid #d0d7de;
        border-radius: 8px;
        margin: 0 0 16px;
        padding: 12px 16px;
      }
      label {
        display: block;
        margin: 6px 0;
      }
      .offer {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 8px;
      }
      .offer input {
        width: 100%;
        box-sizing: border-box;
      }
      button {
        font: inherit;
        padding: 8px 20px;
        border-radius: 6px;
        border: 0;
        background: #0b6e4f;
        color: #fff;
        cursor: pointer;
      }
      .error {
        color: #b42318;
      }
      .person {
        border-top: 1px solid #d0d7de;
        padding: 10px 0;
      }
      .clean {
        color: #0b6e4f;
      }
      .gap {
        font-variant-numeric: tabular-nums;
        color: #b42318;
      }
      small {
        color: #57606a;
      }
    </style>
  </head>
  <body>
    <h1>Wage check</h1>
    <p>
      <small
        >Test page for <code>POST /api/v1/wage-checks</code>. Sign in to the app first.
        Files are compared and not stored.</small
      >
    </p>
    <form id="form">
      <fieldset>
        <label
          >Payroll (Mudad wage file, CSV)
          <input type="file" id="payroll" accept=".csv" required
        /></label>
        <label
          >Qiwa contract (PDF) or contracts list (CSV)
          <input type="file" id="contract" accept=".pdf,.csv" required
        /></label>
      </fieldset>
      <fieldset>
        <legend>Offer letter (optional, used with a PDF), SAR per month</legend>
        <div class="offer">
          <label>Basic <input name="offerBasic" inputmode="decimal" /></label>
          <label>Housing <input name="offerHousing" inputmode="decimal" /></label>
          <label>Transport <input name="offerTransport" inputmode="decimal" /></label>
          <label>Total <input name="offerTotal" inputmode="decimal" /></label>
        </div>
      </fieldset>
      <button>Check</button>
    </form>
    <div id="result" aria-live="polite"></div>
    <script>
      const form = document.getElementById("form");
      const result = document.getElementById("result");
      const el = (tag, text, cls) =>
        Object.assign(document.createElement(tag), {
          textContent: text,
          className: cls ?? "",
        });
      const sar = (n) => `${n > 0 ? "+" : ""}${n.toLocaleString("en-US")} SAR`;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const contract = document.getElementById("contract").files[0];
        const body = new FormData();
        for (const input of form.querySelectorAll(".offer input"))
          if (input.value) body.append(input.name, input.value);
        body.append("payroll", document.getElementById("payroll").files[0]);
        body.append(
          contract.name.toLowerCase().endsWith(".pdf") ? "contract" : "contracts",
          contract,
        );
        result.replaceChildren(el("p", "Checking…"));
        const response = await fetch("/api/v1/wage-checks", {
          method: "POST",
          body,
          credentials: "same-origin",
        });
        const data = await response.json();
        if (!response.ok)
          return result.replaceChildren(el("p", data.detail ?? data.title, "error"));

        const { employees, flagged, underpaidSar } = data.summary;
        const rows = [
          el(
            "h2",
            `${flagged} of ${employees} flagged · ${underpaidSar.toLocaleString("en-US")} SAR underpaid this month`,
          ),
        ];
        for (const person of data.employees) {
          const row = el("div", "", "person");
          row.append(
            el("strong", `${person.name ?? "Unnamed"} `),
            el("small", person.employeeId),
          );
          if (person.issues.length === 0) row.append(el("div", "No mismatches", "clean"));
          const list = el("ul");
          for (const issue of person.issues) {
            const item = el("li", `${issue.message} `);
            if (issue.gap !== null) item.append(el("span", sar(issue.gap), "gap"));
            if (issue.articles.length)
              item.append(el("small", ` · Art. ${issue.articles.join(", ")}`));
            list.append(item);
          }
          row.append(list);
          rows.push(row);
        }
        result.replaceChildren(...rows);
      });
    </script>
  </body>
</html>
