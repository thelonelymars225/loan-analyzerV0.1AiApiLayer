# The whole product on one machine: Postgres + pgvector, the API, the worker and the web app.
# The API and the worker share a volume for the encrypted PDFs.
#
#   docker compose -f infra/docker-compose.yml up --build     (or: pnpm docker:up)
#
# Then open http://localhost:8080. Also published on localhost only:
#   API health   http://localhost:3000/api/v1/healthz
#   Postgres     localhost:5432 (postgres / postgres, database "rater")
#
# Settings come from your shell or from infra/.env (Compose reads the .env file that sits next
# to this file). Every setting has a default, so no .env is needed to start. The default
# passwords and keys are for this local stack only: set your own before you upload a real
# contract. Set ANTHROPIC_API_KEY to rate with Claude; without it the offline heuristic
# analyser runs.

name: contract-rater

# Settings shared by the API, the worker and the one-shot migrate job.
x-app-env: &app-env
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/rater
  LOCAL_STORAGE_DIR: /data/storage
  # Encrypts the PDFs (AES-256-GCM): 32 bytes as base64. Make your own with:
  # openssl rand -base64 32
  STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:-bG9jYWwtY29tcG9zZS1vbmx5LWNoYW5nZS1tZS1rZXk=}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: rater
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rater"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: applies the database migrations and loads the law corpus, then exits.
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    working_dir: /app
    command: ["sh", "-c", "pnpm db:migrate && pnpm law:ingest"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/rater
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    init: true
    environment:
      <<: *app-env
      PORT: "3000"
      # Better Auth signs session cookies with this. At least 32 characters.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-compose-only-secret-change-me}
      # The browser reaches the API through nginx, so both are the web app's address.
      BETTER_AUTH_URL: http://localhost:${WEB_PORT:-8080}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-8080}
      RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-20}
      # The migrate job above already did this.
      DB_MIGRATE_ON_START: "false"
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - storage-data:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    init: true
    environment:
      <<: *app-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      # Empty ANTHROPIC_API_KEY: the offline heuristic analyser. See .env.example for the rest.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_STRUCTURED_OUTPUT: ${LLM_STRUCTURED_OUTPUT:-}
      # The migrate job above already did this.
      DB_MIGRATE_ON_START: "false"
    volumes:
      - storage-data:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  postgres-data:
  # The encrypted PDFs, shared by the API and the worker.
  storage-data:
